
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#080d18">
<title>RUN CITY 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d18;color:white;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.panel{background:#07101cbb;border:1px solid #ffffff25;border-radius:13px;padding:10px 13px;backdrop-filter:blur(8px);font-weight:bold}
.small{font-size:11px;color:#9db5ce;letter-spacing:1px}
.value{font-size:20px;margin-top:4px}
#message{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050b16a8;padding:22px}
.card{width:min(420px,100%);padding:25px 20px;text-align:center;background:#101b2deF;border:1px solid #51c9ff60;border-radius:23px;box-shadow:0 0 40px #168bff24}
h1{font-size:clamp(29px,8vw,48px);line-height:1;margin:0 0 12px;letter-spacing:1px}
h1 span{color:#55d9ff}
.card p{color:#bdcddd;line-height:1.55;font-size:14px}
button{border:0;border-radius:13px;padding:13px 17px;font-size:15px;font-weight:bold;color:white;background:linear-gradient(135deg,#087cff,#06c7e8);cursor:pointer}
#start{width:100%;margin-top:10px}
#hint{font-size:12px;color:#9bb4ca}
#controls{position:absolute;bottom:20px;left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}
.controlGroup{display:flex;gap:12px}
.control{pointer-events:auto;width:58px;height:58px;border:1px solid #ffffff55;background:#07101ca8;border-radius:18px;font-size:23px;backdrop-filter:blur(8px);touch-action:none}
#jump{background:#087cffb8}
#sound{position:absolute;top:88px;right:14px;padding:9px;background:#07101cbb;border:1px solid #ffffff25;border-radius:12px}
#loading{font-size:12px;color:#72dcff;margin-top:12px}
@media(min-width:800px){#controls{padding:0 45px}.control{width:65px;height:65px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div class="panel"><div class="small">DISTANCE</div><div class="value" id="distance">0 m</div></div>
 <div class="panel"><div class="small">COINS</div><div class="value" id="coins">0</div></div>
 <div class="panel"><div class="small">BEST</div><div class="value" id="best">0 m</div></div>
</div>
<button id="sound">🔊</button>
<div id="message">
 <div class="card">
  <div style="font-size:35px;margin-bottom:12px">🏙️</div>
  <h1>RUN <span>CITY</span></h1>
  <p>Run through the city, dodge traffic, collect coins and beat your high score.</p>
  <p id="hint">Swipe left/right to move · Swipe up to jump</p>
  <button id="start">START RUN</button>
  <div id="loading">Preparing the 3D city...</div>
 </div>
</div>
<div id="controls">
 <div class="controlGroup">
  <button class="control" id="left">◀</button>
  <button class="control" id="right">▶</button>
 </div>
 <div class="controlGroup">
  <button class="control" id="jump">⬆</button>
 </div>
</div>
<script type="module">
  
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/loaders/GLTFLoader.js';

const root = document.getElementById('game');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x91b8d7);
scene.fog = new THREE.Fog(0x91b8d7, 38, 155);

const camera = new THREE.PerspectiveCamera(62, innerWidth/innerHeight, 0.1, 220);
camera.position.set(0, 4.5, 9);

const renderer = new THREE.WebGLRenderer({
 antialias: true, powerPreference: 'high-performance'
});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
root.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xe3f3ff, 0x4b5261, 2.1));

const sun = new THREE.DirectionalLight(0xffe4c2, 3);
sun.position.set(-12, 22, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -15;
sun.shadow.camera.right = 15;
sun.shadow.camera.top = 22;
sun.shadow.camera.bottom = -22;
scene.add(sun);

const mat = (color, roughness=0.8, metalness=0) =>
 new THREE.MeshStandardMaterial({color, roughness, metalness});

const roadMat = mat(0x303640, 0.95);
const pavementMat = mat(0x969da5);
const lineMat = mat(0xf6f3dc);
const buildingMats = [
 mat(0x9caab7), mat(0xc3b8a8), mat(0x667c90),
 mat(0xb4b5b0), mat(0x596b7b), mat(0xd1c9bc)
];

const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 240), mat(0x5e7662));
floor.rotation.x = -Math.PI/2;
floor.position.set(0,-0.13,-75);
floor.receiveShadow = true;
scene.add(floor);

const road = new THREE.Mesh(new THREE.PlaneGeometry(10,240),roadMat);
road.rotation.x = -Math.PI/2;
road.position.set(0,-0.08,-75);
road.receiveShadow = true;
scene.add(road);

for (const x of [-6,6]) {
 const curb = new THREE.Mesh(new THREE.BoxGeometry(2,0.22,240),pavementMat);
 curb.position.set(x,-0.01,-75);
 curb.receiveShadow = true;
 scene.add(curb);
}

const laneMarkers = [];
for(let z=20; z>-190; z-=8){
 for(const x of [-1.67,1.67]){
  const marker = new THREE.Mesh(new THREE.BoxGeometry(0.10,0.025,3.5),lineMat);
  marker.position.set(x,-0.025,z);
  scene.add(marker);
  laneMarkers.push(marker);
 }
}

const city = new THREE.Group();
scene.add(city);

function makeBuilding(x,z){
 const w=THREE.MathUtils.randFloat(3.5,7);
 const h=THREE.MathUtils.randFloat(7,27);
 const d=THREE.MathUtils.randFloat(5,10);
 const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),
  buildingMats[Math.floor(Math.random()*buildingMats.length)]);
 b.position.set(x,h/2-0.08,z);
 b.castShadow=true;
 b.receiveShadow=true;
 city.add(b);

 const windowMat=new THREE.MeshStandardMaterial({
  color:0x9edcff, emissive:0x234a64, emissiveIntensity:0.35,
  roughness:0.35, metalness:0.1
 });
 for(let yy=1.5; yy<h-1; yy+=2.5){
  for(let xx=-w/2+0.6; xx<w/2-0.3; xx+=1.15){
   const win=new THREE.Mesh(new THREE.PlaneGeometry(0.55,0.85),windowMat);
   win.position.set(x+xx,yy,z+d/2+0.012);
   city.add(win);
  }
 }
}

for(let z=-10; z>-190; z-=14){
 makeBuilding(-10,z);
 makeBuilding(10,z-5);
}

const streetLights = [];
for(let z=12; z>-180; z-=22){
 for(const x of [-5.4,5.4]){
  const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.1,4.4,8),mat(0x48515a,0.5,0.6));
  pole.position.set(x,2.2,z);
  city.add(pole);
  const arm=new THREE.Mesh(new THREE.BoxGeometry(0.85,0.08,0.08),mat(0x48515a,0.5,0.6));
  arm.position.set(x+(x<0?0.35:-0.35),4.2,z);
  city.add(arm);
  const lamp=new THREE.PointLight(0xffe1a6,2.5,9);
  lamp.position.set(x+(x<0?0.7:-0.7),4.05,z);
  city.add(lamp);
  streetLights.push({pole,arm,lamp});
 }
  }
  
const player = new THREE.Group();
scene.add(player);
player.position.set(0,0,2);

let mixer=null;
let runAction=null;
let modelLoaded=false;

function makeFallbackRunner(){
 const g=new THREE.Group();
 const skin=mat(0xc88e68);
 const shirt=mat(0x1768bd,0.45);
 const pants=mat(0x202d42,0.65);
 const shoe=mat(0x111923,0.4);
 const head=new THREE.Mesh(new THREE.SphereGeometry(0.25,20,16),skin);
 head.position.y=1.65;
 g.add(head);
 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(0.27,0.55,5,12),shirt);
 torso.position.y=1.13;
 g.add(torso);
 const limbGeo=new THREE.CapsuleGeometry(0.095,0.48,4,10);
 const legGeo=new THREE.CapsuleGeometry(0.115,0.42,4,10);
 const limbs=[];
 for(const side of [-1,1]){
  const arm=new THREE.Mesh(limbGeo,skin);
  arm.position.set(side*0.36,1.15,0);
  g.add(arm);
  const leg=new THREE.Mesh(legGeo,pants);
  leg.position.set(side*0.15,0.48,0);
  g.add(leg);
  const foot=new THREE.Mesh(new THREE.BoxGeometry(0.2,0.11,0.34),shoe);
  foot.position.set(side*0.15,0.14,-0.07);
  g.add(foot);
  limbs.push({arm,leg,side});
 }
 return {group:g,limbs};
}

const fallback=makeFallbackRunner();
player.add(fallback.group);
let elapsed=0;

const loader=new GLTFLoader();
loader.load(
 'https://threejs.org/examples/models/gltf/Soldier.glb',
 gltf=>{
  player.remove(fallback.group);
  player.add(gltf.scene);
  gltf.scene.scale.setScalar(1);
  gltf.scene.position.set(0,0,0);
  gltf.scene.rotation.y=Math.PI;
  gltf.scene.traverse(o=>{
   if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}
  });
  mixer=new THREE.AnimationMixer(gltf.scene);
  const clips=gltf.animations;
  const run=clips.find(c=>/run/i.test(c.name)) || clips[0];
  if(run){
   runAction=mixer.clipAction(run);
   runAction.play();
  }
  modelLoaded=true;
  document.getElementById('loading').textContent='3D runner loaded';
 },
 undefined,
 ()=>{
  document.getElementById('loading').textContent='Using built-in runner';
 }
);

const obstacleGroup=new THREE.Group();
scene.add(obstacleGroup);
const obstacles=[];
const coinGroup=new THREE.Group();
scene.add(coinGroup);
const coinObjects=[];

function addObstacle(lane,z){
 const group=new THREE.Group();
 const x=lane*2.1;
 const type=Math.random();
 if(type<0.48){
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.35,1.05,2.2),mat(0xc83c37,0.4,0.2));
  body.position.y=0.58;
  body.castShadow=true;
  group.add(body);
  const glass=new THREE.Mesh(new THREE.BoxGeometry(1.08,0.35,0.06),mat(0x9cd6e9,0.25,0.25));
  glass.position.set(0,0.87,1.12);
  group.add(glass);
  const bumper=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.16,0.12),mat(0x30343b,0.35,0.5));
  bumper.position.set(0,0.27,1.12);
  group.add(bumper);
 }else{
  const block=new THREE.Mesh(new THREE.BoxGeometry(1.25,1.35,0.85),mat(0xe7a32f,0.6));
  block.position.y=0.72;
  block.castShadow=true;
  group.add(block);
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(1.27,0.2,0.87),mat(0x252a31,0.7));
  stripe.position.y=0.72;
  group.add(stripe);
 }
 group.position.set(x,0,z);
 obstacleGroup.add(group);
 obstacles.push({group,lane,z});
}

function addCoin(lane,z){
 const coin=new THREE.Mesh(
  new THREE.TorusGeometry(0.32,0.095,10,20),
  new THREE.MeshStandardMaterial({
   color:0xffd34e,metalness:0.75,roughness:0.23,
   emissive:0x704000,emissiveIntensity:0.35
  })
 );
 coin.position.set(lane*2.1,1.2,z);
 coin.rotation.y=Math.PI/2;
 coin.castShadow=true;
 coinGroup.add(coin);
 coinObjects.push(coin);
}

function resetWorld(){
 obstacles.forEach(o=>obstacleGroup.remove(o.group));
 coinObjects.forEach(c=>coinGroup.remove(c));
 obstacles.length=0;
 coinObjects.length=0;
 for(let i=0;i<8;i++){
  const z=-18-i*13;
  addObstacle(Math.floor(Math.random()*3)-1,z);
  if(Math.random()<0.9)addCoin(Math.floor(Math.random()*3)-1,z-5);
 }
    }
  
let running=false;
let gameOver=false;
let lane=0;
let jumpY=0;
let jumpVelocity=0;
let score=0;
let coinCount=0;
let speed=17;
let spawnTimer=0;
let soundOn=true;
let audioContext=null;
let lastTime=0;
let best=Number(localStorage.getItem('runcity-best')||0);

document.getElementById('best').textContent=best+' m';

function beep(freq=650,duration=0.08){
 if(!soundOn)return;
 try{
  audioContext ||= new (window.AudioContext||window.webkitAudioContext)();
  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();
  osc.frequency.value=freq;
  gain.gain.value=0.045;
  osc.connect(gain);
  gain.connect(audioContext.destination);
  osc.start();
  gain.gain.exponentialRampToValueAtTime(0.001,audioContext.currentTime+duration);
  osc.stop(audioContext.currentTime+duration);
 }catch(e){}
}

function moveLane(dir){
 if(!running)return;
 lane=THREE.MathUtils.clamp(lane+dir,-1,1);
 beep(440,0.045);
}
function jump(){
 if(!running||jumpY>0.05)return;
 jumpVelocity=8.8;
 beep(720,0.1);
}
function startGame(){
 score=0;
 coinCount=0;
 speed=17;
 lane=0;
 jumpY=0;
 jumpVelocity=0;
 spawnTimer=0;
 gameOver=false;
 running=true;
 resetWorld();
 document.getElementById('message').style.display='none';
 updateHUD();
 lastTime=performance.now();
}
function endGame(){
 running=false;
 gameOver=true;
 const metres=Math.floor(score);
 if(metres>best){
  best=metres;
  localStorage.setItem('runcity-best',best);
 }
 document.getElementById('best').textContent=best+' m';
 document.querySelector('#message h1').innerHTML='RUN <span>OVER</span>';
 document.querySelector('#message p').textContent='Distance: '+metres+' m · Coins: '+coinCount;
 document.getElementById('start').textContent='RUN AGAIN';
 document.getElementById('message').style.display='flex';
 beep(180,0.3);
}
function updateHUD(){
 document.getElementById('distance').textContent=Math.floor(score)+' m';
 document.getElementById('coins').textContent=coinCount;
 document.getElementById('best').textContent=best+' m';
}

document.getElementById('start').addEventListener('click',()=>{
 if(audioContext&&audioContext.state==='suspended')audioContext.resume();
 startGame();
});
document.getElementById('left').addEventListener('pointerdown',e=>{e.preventDefault();moveLane(-1)});
document.getElementById('right').addEventListener('pointerdown',e=>{e.preventDefault();moveLane(1)});
document.getElementById('jump').addEventListener('pointerdown',e=>{e.preventDefault();jump()});
document.getElementById('sound').addEventListener('click',()=>{
 soundOn=!soundOn;
 document.getElementById('sound').textContent=soundOn?'🔊':'🔇';
});

let touchStartX=0,touchStartY=0;
renderer.domElement.addEventListener('touchstart',e=>{
 const t=e.changedTouches[0];
 touchStartX=t.clientX;
 touchStartY=t.clientY;
},{passive:true});
renderer.domElement.addEventListener('touchend',e=>{
 const t=e.changedTouches[0];
 const dx=t.clientX-touchStartX;
 const dy=t.clientY-touchStartY;
 if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;
 if(Math.abs(dx)>Math.abs(dy))moveLane(dx>0?1:-1);
 else if(dy<0)jump();
},{passive:true});

window.addEventListener('keydown',e=>{
 if(['ArrowLeft','ArrowRight','ArrowUp',' ','a','d','w'].includes(e.key))e.preventDefault();
 if(e.key==='ArrowLeft'||e.key==='a')moveLane(-1);
 if(e.key==='ArrowRight'||e.key==='d')moveLane(1);
 if(e.key==='ArrowUp'||e.key==='w'||e.key===' ')jump();
 if(e.key==='Enter'&&!running)startGame();
});

function updateGame(dt){
 if(!running)return;
 score+=dt*speed*0.6;
 speed=Math.min(29,17+score*0.008);
 spawnTimer+=dt;
 if(spawnTimer>1.05){
  spawnTimer=0;
  const l=Math.floor(Math.random()*3)-1;
  addObstacle(l,-115);
  if(Math.random()<0.95)addCoin(Math.floor(Math.random()*3)-1,-121);
 }
 for(const marker of laneMarkers){
  marker.position.z+=speed*dt;
  if(marker.position.z>12)marker.position.z-=208;
 }
 for(const item of city.children){
  item.position.z+=speed*dt;
  if(item.position.z>25)item.position.z-=196;
 }
 for(const item of streetLights){
  item.pole.position.z+=speed*dt;
  item.arm.position.z+=speed*dt;
  item.lamp.position.z+=speed*dt;
  if(item.pole.position.z>20){
   item.pole.position.z-=198;
   item.arm.position.z-=198;
   item.lamp.position.z-=198;
  }
 }
 jumpVelocity-=20*dt;
 jumpY=Math.max(0,jumpY+jumpVelocity*dt);
 if(jumpY===0)jumpVelocity=0;
 player.position.x=THREE.MathUtils.damp(player.position.x,lane*2.1,12,dt);
 player.position.y=jumpY;

 if(mixer)mixer.update(dt);
 if(!modelLoaded){
  for(const limb of fallback.limbs){
   limb.leg.rotation.x=Math.sin(elapsed*13+(limb.side>0?Math.PI:0))*0.75;
   limb.arm.rotation.x=Math.sin(elapsed*13+(limb.side<0?Math.PI:0))*0.7;
  }
  fallback.group.position.y=Math.sin(elapsed*13)*0.045;
 }
 for(let i=obstacles.length-1;i>=0;i--){
  const o=obstacles[i];
  o.z+=speed*dt;
  o.group.position.z=o.z;
  if(o.z>3.0){
   obstacleGroup.remove(o.group);
   obstacles.splice(i,1);
   continue;
  }
  const sameLane=Math.abs(player.position.x-o.lane*2.1)<1.05;
  const near=Math.abs(o.z-player.position.z)<1.25;
  if(sameLane&&near&&jumpY<0.8){
   endGame();
   return;
  }
 }
 for(let i=coinObjects.length-1;i>=0;i--){
  const c=coinObjects[i];
  c.position.z+=speed*dt;
  c.rotation.y+=dt*2.7;
  c.rotation.x+=dt*0.5;
  if(c.position.z>4){
   coinGroup.remove(c);
   coinObjects.splice(i,1);
   continue;
  }
  if(Math.abs(c.position.z-player.position.z)<1.25&&
     Math.abs(c.position.x-player.position.x)<1.15&&
     Math.abs(c.position.y-(1.2+jumpY))<1.5){
   coinCount++;
   coinGroup.remove(c);
   coinObjects.splice(i,1);
   beep(880,0.07);
  }
 }
 updateHUD();
  }
  
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-lastTime)/1000||0,0.035);
 lastTime=now;
 elapsed+=dt;

 updateGame(dt);

 camera.position.x=THREE.MathUtils.damp(camera.position.x,player.position.x*0.28,3,dt);
 camera.position.y=THREE.MathUtils.damp(camera.position.y,4.5+jumpY*0.1,3,dt);
 camera.lookAt(player.position.x*0.22,1.15,-5);

 renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));
});

resetWorld();
requestAnimationFrame(animate);
</script>
</body>
</html>
