
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sky Runner 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#080b1c;color:white;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;padding:16px;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;justify-content:space-between;align-items:start}
.brand{font-size:22px;font-weight:900;letter-spacing:2px;text-shadow:0 0 16px #48f5ff}
.brand span{color:#48f5ff}
.stats{display:flex;gap:8px}
.pill{background:#101833dd;border:1px solid #ffffff33;border-radius:12px;padding:8px 12px;text-align:center;min-width:70px}
.pill small{display:block;font-size:10px;color:#b9c8eb}
.pill strong{font-size:20px}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90%,420px);padding:25px 20px;text-align:center;background:#0c1229ed;border:1px solid #48f5ff55;border-radius:24px;box-shadow:0 0 45px #48f5ff18}
.panel.hidden{display:none}
.eyebrow{color:#48f5ff;font-size:11px;font-weight:bold;letter-spacing:3px}
h1{font-size:clamp(36px,10vw,54px);line-height:1;margin:12px 0}
h1 em{font-style:normal;color:#ff4fd8}
.copy{font-size:14px;line-height:1.6;color:#c2cce6;margin:0 0 20px}
button{font:inherit;cursor:pointer;touch-action:manipulation}
.primary{width:100%;border:0;border-radius:13px;padding:15px;background:linear-gradient(90deg,#48f5ff,#9ffff7);color:#07111f;font-weight:900}
.secondary{margin-top:12px;background:transparent;color:#c2cce6;border:0;font-size:12px}
.bottom{display:flex;justify-content:space-between;align-items:end}
.tip{font-size:11px;line-height:1.6;color:#d2ddf5}
.sound{pointer-events:auto;border:1px solid #ffffff33;border-radius:12px;padding:9px 12px;background:#101833dd;color:white}
.controls{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}
.controls.hidden{display:none}
.pad{display:flex;gap:10px}
.control{pointer-events:auto;width:60px;height:60px;border-radius:18px;background:#101833dd;border:1px solid #ffffff55;color:white;font-size:25px;font-weight:bold}
.jump{width:76px;color:#48f5ff;border-color:#48f5ff88;font-size:13px}
@media(min-width:700px){.controls{padding:0 7vw}}
</style>
</head>
<body>
<div id="game"></div>
<div class="hud">
  <div class="top">
    <div class="brand">SKY<span>RUNNER</span> 3D</div>
    <div class="stats">
      <div class="pill"><small>SCORE</small><strong id="score">0</strong></div>
      <div class="pill"><small>COINS</small><strong id="coins">0</strong></div>
    </div>
  </div>
  <div class="bottom">
    <div class="tip">LEFT / RIGHT: CHANGE LANE<br>JUMP: AVOID OBSTACLES</div>
    <button class="sound" id="sound">🔊 Sound</button>
  </div>
</div>
<div class="panel" id="panel">
  <div class="eyebrow" id="eyebrow">READY, RUNNER?</div>
  <h1 id="title">SKY <em>RUNNER</em></h1>
  <p class="copy" id="copy">Run across the sky, collect coins and dodge obstacles in this 3D adventure!</p>
  <button class="primary" id="start">▶ START RUN</button>
  <button class="secondary" id="help">How to play</button>
</div>
<div class="controls hidden" id="controls">
  <div class="pad">
    <button class="control" id="left">←</button>
    <button class="control" id="right">→</button>
  </div>
  <button class="control jump" id="jump">JUMP ↑</button>
</div>
<script type="module">
  
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const root=document.getElementById('game');
const scoreEl=document.getElementById('score');
const coinsEl=document.getElementById('coins');
const panel=document.getElementById('panel');
const controls=document.getElementById('controls');
const titleEl=document.getElementById('title');
const eyebrowEl=document.getElementById('eyebrow');
const copyEl=document.getElementById('copy');

let scene,camera,renderer,clock,player;
let running=false,muted=false;
let score=0,coins=0,speed=18;
let lane=0,jumpV=0,playerY=0;
let spawnTimer=0,coinTimer=0;
let obstacles=[],coinObjects=[],trackBits=[],decor=[];
let audioCtx=null;

const laneX=[-2.35,0,2.35];

function mat(color,emissive=0){
 return new THREE.MeshStandardMaterial({
  color,emissive,emissiveIntensity:emissive?0.7:0,
  metalness:0.2,roughness:0.45
 });
}
function makeBox(w,h,d,material,x=0,y=0,z=0){
 const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 mesh.position.set(x,y,z);
 mesh.castShadow=true;
 mesh.receiveShadow=true;
 return mesh;
}
function makePlayer(){
 const g=new THREE.Group();
 g.add(makeBox(.72,.9,.48,mat(0x19d9f2,0x063c55),0,1.1,0));
 const head=new THREE.Mesh(
  new THREE.SphereGeometry(.32,18,14),mat(0xffc89b)
 );
 head.position.y=1.82;
 g.add(head);
 const hair=new THREE.Mesh(
  new THREE.SphereGeometry(.33,16,10,0,Math.PI*2,0,Math.PI*.55),
  mat(0x20243b)
 );
 hair.position.y=1.94;
 g.add(hair);
 for(const s of [-1,1]){
  const arm=makeBox(.22,.72,.24,mat(0x9b5cff),s*.49,1.15,0);
  arm.rotation.z=s*.12;
  g.add(arm);
  g.add(makeBox(.25,.65,.28,mat(0x29365d),s*.2,.38,0));
  g.add(makeBox(.3,.16,.44,mat(0xff4fd8,0x67134e),s*.2,.08,-.07));
 }
 const light=new THREE.PointLight(0x38eaff,1.3,5);
 light.position.set(0,1,1);
 g.add(light);
 return g;
}

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x080b1c);
 scene.fog=new THREE.Fog(0x080b1c,22,100);

 camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,180);
 camera.position.set(0,5.1,9.8);
 camera.lookAt(0,1,0);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;
 renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 renderer.toneMapping=THREE.ACESFilmicToneMapping;
 renderer.toneMappingExposure=1.15;
 root.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0x9dbbff,0x17102d,2));
 const sun=new THREE.DirectionalLight(0xffffff,2.2);
 sun.position.set(-4,10,6);
 sun.castShadow=true;
 sun.shadow.mapSize.set(1024,1024);
 scene.add(sun);

 const trackMat=mat(0x111a34,0x080d1e);
 const lineMat=mat(0x15334c,0x0b9cb5);
 const railMat=mat(0x2cefff,0x0ba5c8);

 scene.add(makeBox(9,.4,180,trackMat,0,-.25,-55));

 for(let z=10;z>-130;z-=5){
  for(const x of [-1.175,1.175]){
   const m=makeBox(.035,.025,2.1,lineMat,x,-.025,z);
   scene.add(m);trackBits.push(m);
  }
  for(const x of [-4.3,4.3]){
   const m=makeBox(.08,.12,5,railMat,x,.02,z-2.5);
   scene.add(m);trackBits.push(m);
  }
 }

 const buildingMats=[
  mat(0x151d42,0x20104b),
  mat(0x10283a,0x06465d),
  mat(0x24163d,0x4b105a)
 ];
 for(let i=0;i<36;i++){
  const side=i%2?1:-1;
  const z=-i*4.5-4;
  const h=2+Math.random()*9;
  const w=1+Math.random()*2;
  const b=makeBox(w,h,w,buildingMats[i%3],
   side*(6+Math.random()*8),h/2-.2,z);
  b.castShadow=false;
  scene.add(b);decor.push(b);
 }
 const starGeo=new THREE.BufferGeometry();
 const positions=[];
 for(let i=0;i<450;i++){
  positions.push((Math.random()-.5)*90,
   Math.random()*35+3,-Math.random()*150);
 }
 starGeo.setAttribute('position',
  new THREE.Float32BufferAttribute(positions,3));
 scene.add(new THREE.Points(starGeo,
  new THREE.PointsMaterial({color:0xb7eaff,size:.11})));

 player=makePlayer();
 player.position.set(0,0,2);
 scene.add(player);
 clock=new THREE.Clock();
 addEventListener('resize',resize);
 renderer.setAnimationLoop(animate);
}

function resize(){
 if(!camera||!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.fov=innerWidth<500?67:62;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
    }
  
function playTone(freq=660,duration=.07,type='sine'){
 if(muted)return;
 try{
  audioCtx ||= new (window.AudioContext||window.webkitAudioContext)();
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type=type;
  o.frequency.value=freq;
  g.gain.setValueAtTime(.055,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,
   audioCtx.currentTime+duration);
  o.connect(g);g.connect(audioCtx.destination);
  o.start();o.stop(audioCtx.currentTime+duration);
 }catch(e){}
}

function addObstacle(){
 const laneIdx=Math.floor(Math.random()*3);
 const z=-75-Math.random()*8;
 const wall=Math.random()<.22;
 const material=mat(wall?0xff4fd8:0xffa63d,
  wall?0x741052:0x713000);
 const mesh=makeBox(wall?1.35:1.15,
  wall?2.3:.9,.8,material,laneX[laneIdx],
  wall?1.15:.45,z);
 scene.add(mesh);
 obstacles.push({mesh,lane:laneIdx,wall,passed:false});
}

function addCoinLine(){
 const laneIdx=Math.floor(Math.random()*3);
 const count=4+Math.floor(Math.random()*3);
 const startZ=-66-Math.random()*8;
 for(let i=0;i<count;i++){
  const mesh=new THREE.Mesh(
   new THREE.TorusGeometry(.28,.085,8,18),
   mat(0xffdf58,0x8a5b00)
  );
  mesh.position.set(laneX[laneIdx],1.15,startZ-i*2.1);
  mesh.rotation.y=Math.PI/2;
  scene.add(mesh);
  coinObjects.push({mesh,lane:laneIdx,taken:false});
 }
}

function startGame(){
 score=0;coins=0;speed=18;
 spawnTimer=.6;coinTimer=1.2;
 lane=0;jumpV=0;playerY=0;
 obstacles.forEach(o=>scene.remove(o.mesh));
 coinObjects.forEach(c=>scene.remove(c.mesh));
 obstacles=[];coinObjects=[];
 player.position.set(0,0,2);
 player.rotation.set(0,0,0);
 running=true;
 panel.classList.add('hidden');
 controls.classList.remove('hidden');
 scoreEl.textContent='0';
 coinsEl.textContent='0';
 clock.getDelta();
 playTone(520,.1);
}

function endGame(){
 if(!running)return;
 running=false;
 controls.classList.add('hidden');
 eyebrowEl.textContent='RUN COMPLETE';
 titleEl.innerHTML='NICE <em>TRY!</em>';
 copyEl.textContent=`You scored ${Math.floor(score)} points and collected ${coins} coins. Try again!`;
 document.getElementById('start').textContent='↻ PLAY AGAIN';
 panel.classList.remove('hidden');
 playTone(150,.35,'sawtooth');
}

function moveLane(direction){
 if(!running)return;
 lane=Math.max(-1,Math.min(1,lane+direction));
 playTone(320,.035);
}

function jump(){
 if(!running||playerY>.03)return;
 jumpV=9.5;
 playTone(450,.07);
}
  
function update(dt){
 if(!running)return;

 speed=Math.min(30,18+score/180);
 score+=dt*10;
 scoreEl.textContent=Math.floor(score);

 spawnTimer-=dt;
 if(spawnTimer<=0){
  addObstacle();
  spawnTimer=Math.max(.55,1.18-score/1500)+Math.random()*.45;
 }

 coinTimer-=dt;
 if(coinTimer<=0){
  addCoinLine();
  coinTimer=2.4+Math.random()*1.2;
 }

 player.position.x=THREE.MathUtils.damp(
  player.position.x,laneX[lane+1],12,dt
 );

 jumpV-=22*dt;
 playerY=Math.max(0,playerY+jumpV*dt);
 if(playerY===0)jumpV=0;

 player.position.y=playerY;
 player.rotation.z=THREE.MathUtils.damp(
  player.rotation.z,
  -(laneX[lane+1]-player.position.x)*.08,8,dt
 );

 camera.position.x=THREE.MathUtils.damp(
  camera.position.x,player.position.x*.25,2,dt
 );
 camera.lookAt(player.position.x*.12,1,0);

 for(const o of obstacles){
  o.mesh.position.z+=speed*dt;
  if(!o.passed&&o.mesh.position.z>1.6){
   o.passed=true;
   if(o.lane===lane+1&&playerY<(o.wall?1.65:1.05)){
    endGame();break;
   }
  }
 }

 for(const c of coinObjects){
  c.mesh.position.z+=speed*dt;
  c.mesh.rotation.z+=dt*3;
  if(!c.taken&&Math.abs(c.mesh.position.z-2)<1.15
    &&c.lane===lane+1&&playerY<2.1){
   c.taken=true;
   coins++;
   coinsEl.textContent=coins;
   score+=25;
   playTone(900,.08);
  }
 }

 obstacles=obstacles.filter(o=>{
  if(o.mesh.position.z>14){
   scene.remove(o.mesh);return false;
  }
  return true;
 });

 coinObjects=coinObjects.filter(c=>{
  if(c.taken||c.mesh.position.z>14){
   scene.remove(c.mesh);return false;
  }
  return true;
 });

 for(const m of trackBits){
  m.position.z+=speed*dt;
  if(m.position.z>12)m.position.z-=140;
 }

 for(const b of decor){
  b.position.z+=speed*dt*.3;
  if(b.position.z>18)b.position.z-=165;
 }
}

function animate(){
 const dt=Math.min(clock.getDelta(),.04);
 if(running)update(dt);
 else{
  player.position.y=Math.sin(performance.now()*.0015)*.05;
  player.rotation.y=Math.sin(performance.now()*.0007)*.05;
 }
 renderer.render(scene,camera);
}
  
document.getElementById('start').addEventListener('click',startGame);

document.getElementById('help').addEventListener('click',()=>{
 copyEl.textContent=
  'Use left and right buttons to switch lanes. Tap JUMP to clear low barriers. Swipe left/right or swipe up to jump. Collect glowing coins!';
});

document.getElementById('left').addEventListener('pointerdown',e=>{
 e.preventDefault();moveLane(-1);
});
document.getElementById('right').addEventListener('pointerdown',e=>{
 e.preventDefault();moveLane(1);
});
document.getElementById('jump').addEventListener('pointerdown',e=>{
 e.preventDefault();jump();
});

document.getElementById('sound').addEventListener('click',()=>{
 muted=!muted;
 document.getElementById('sound').textContent=
  muted?'🔇 Sound':'🔊 Sound';
 if(!muted)playTone();
});

addEventListener('keydown',e=>{
 if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a')moveLane(-1);
 if(e.key==='ArrowRight'||e.key.toLowerCase()==='d')moveLane(1);
 if(e.key==='ArrowUp'||e.key===' '||e.key.toLowerCase()==='w'){
  e.preventDefault();jump();
 }
 if(e.key==='Enter'&&!running)startGame();
});

let sx=0,sy=0;

addEventListener('touchstart',e=>{
 if(e.target.closest('button'))return;
 const t=e.changedTouches[0];
 sx=t.clientX;sy=t.clientY;
},{passive:true});

addEventListener('touchend',e=>{
 if(e.target.closest('button'))return;
 const t=e.changedTouches[0];
 const dx=t.clientX-sx,dy=t.clientY-sy;
 if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
 if(Math.abs(dx)>Math.abs(dy)){
  moveLane(dx>0?1:-1);
 }else if(dy<0){
  jump();
 }
},{passive:true});

init();
</script>
</body>
</html>
